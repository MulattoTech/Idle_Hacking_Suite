name: Validate Idle Hacking Suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-integrity:
    name: Node tests and Chromium extension integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run regression suite
        run: npm test
      - name: Verify extension
        run: npm run check:extension
